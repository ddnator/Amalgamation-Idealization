<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="stylesheet" href="minigame1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="minigame1.js" defer></script>

    <title>Reactor 01</title>
</head>
<body>
<header>
    <div>
        <h1>Reactor 01</h1>
        <p>Core stability interface</p>
    </div>
    <div id="date-time">
        <p id="date"></p>
        <p id="time"></p>
    </div>
</header>
<main>
    <div id="core-details">
        <div id="core-details-div">
            <div id="core-details-header">
                <h2>Core Details</h2>
            </div>
            <div class="core-detail">
                <p>Core temperature</p>
                <div class="core-detail-value">
                    <p>670°C</p>
                    <div class="progress-bar" role="progressbar" aria-label="Core temperature" aria-valuenow="67"
                         aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-fill" style="width: 67%"></div>
                    </div>
                </div>
            </div>
            <div class="core-detail">
                <p>Pressure</p>
                <div class="core-detail-value">
                    <p>80%</p>
                    <div class="progress-bar" role="progressbar" aria-label="Pressure" aria-valuenow="80"
                         aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-fill" style="width: 80%"></div>
                    </div>
                </div>
            </div>
            <div class="core-detail">
                <p>Coolant flow</p>
                <div class="core-detail-value">
                    <p>50%</p>
                    <div class="progress-bar" role="progressbar" aria-label="Coolant flow" aria-valuenow="50"
                         aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-fill" style="width: 50%"></div>
                    </div>
                </div>
            </div>
            <div class="core-detail">
                <p>Power</p>
                <div class="core-detail-value">
                    <p>70%</p>
                    <div class="progress-bar" role="progressbar" aria-label="Power" aria-valuenow="70" aria-valuemin="0"
                         aria-valuemax="100">
                        <div class="progress-fill" style="width: 70%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="core-controls">
        <div id="pick-menu">
            <div>
                <h3>Keep the machine working</h3>
                <p>look at the system messages for help</p>
            </div>
            <div id="choices-menu">
                <div id="choice-1"></div>
                <div id="choice-2"></div>
                <div id="choice-3"></div>
                <div id="choice-4"></div>
            </div>
        </div>
        <div id="system-message">
            <div>
                <h3>System messages</h3>
                <p>all that's not working correctly</p>
            </div>
            <div id="messages">

            </div>
        </div>
    </div>
</main>
<dialog>
    <button class="close">X</button>
    <div id="dialog-content">

    </div>
</dialog>
<footer>
    <div id="work-info">
        <div>
            <p>Working...</p>
        </div>
        <div id="money-made">
            <p>$100</p>
        </div>
    </div>
    <div class="work-bar" role="progressbar" aria-label="work-value" aria-valuenow="10" aria-valuemin="0"
         aria-valuemax="100">
        <div class="work-fill" style="width: 10%"></div>
    </div>
</footer>

</body>
</html>
